name: Publish Gem

# Publishes the gem to RubyGems when a GitHub release is published. The release tag
# must be v<version> for the version the gemspec declares. Signs in with RubyGems
# trusted publishing (OIDC), so no API key is stored; the gem's trusted publisher on
# rubygems.org must name this repository and this workflow file.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6

      - name: Verify the release tag matches the gemspec version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(ruby -e 'print Gem::Specification.load(Dir["*.gemspec"].first).version')"
          echo "Release tag: ${TAG} | gemspec version: ${VERSION}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Release tag ${TAG} does not match the gemspec version (expected v${VERSION})"
            exit 1
          fi

      - name: Build gem
        run: gem build *.gemspec

      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push to RubyGems
        run: gem push *.gem
