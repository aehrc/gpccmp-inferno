# Aidbox validator stack: an override applied on top of compose.yaml.
#   docker compose -f compose.yaml -f compose.aidbox.yaml ...   (make ... STACK=aidbox)
# Only what differs from the default stack lives here: the validator.
services:
  inferno:
    depends_on:
      validator-api-worker:
        condition: service_started
  inferno-worker:
    depends_on:
      validator-api-worker:
        condition: service_started
  validator-api-worker:
    image: ghcr.io/beda-software/aidbox-validator/aidbox-validator:main-891628f
    depends_on:
      validator-api:
        condition: service_healthy
    links:
      - validator-api
    env_file:
      - ./env/app
      - .env
    tty: true
  validator-api:
    image: docker.io/healthsamurai/aidboxone:2605
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - "postgres:database"
    ports:
      - "127.0.0.1:3500:3500"
    env_file:
      - ./env/aidbox
      - .env
    # The default stack's validator settings do not apply to Aidbox.
    environment: !reset null
    volumes: !override
      - ./resources:/resources
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      interval: 1s
      timeout: 20s
      retries: 100
      test: curl --fail http://validator-api:3500/health || exit 1
